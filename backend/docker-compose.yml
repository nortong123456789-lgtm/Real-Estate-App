version: '3.8'

services:
  telegram_bot_api:
    image: aiogram/telegram-bot-api:latest
    container_name: realestate_telegram_api
    environment:
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "0123456789abcdef0123456789abcdef"
      TELEGRAM_LOCAL: "true"
    ports:
      - "8081:8081"

  web_api:
    build: .
    container_name: realestate_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_LOCAL_API_SERVER: ${TELEGRAM_LOCAL_API_SERVER:-http://telegram_bot_api:8081}
      TEMP_MEDIA_DIR: ${TEMP_MEDIA_DIR:-/tmp/realestate_media}
      LOCAL_INDEX_CACHE_PATH: ${LOCAL_INDEX_CACHE_PATH:-/tmp/telegram_listings_index.json}
    volumes:
      - media_temp:/tmp/realestate_media
    depends_on:
      - telegram_bot_api

volumes:
  media_temp:
